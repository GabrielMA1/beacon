name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Run manually from the Actions tab
  workflow_dispatch:
  # Let the platform trigger a rebuild when models or rates change:
  #   POST /repos/GabrielMA1/beacon/dispatches  {"event_type": "catalog-updated"}
  repository_dispatch:
    types: [catalog-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Build
        run: npm run build
        env:
          # A public URL, stored as a repository *variable* (not a secret).
          PUBLIC_MODELS_API_URL: ${{ vars.PUBLIC_MODELS_API_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
